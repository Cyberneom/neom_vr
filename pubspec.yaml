# publish_to: 'none'

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  neom_core: ^2.0.0
  neom_commons: ^2.0.0

  #Virtual Reality Experimental
#  flutter_custom_tabs: 2.4.0
#  panorama: ^0.4.1
