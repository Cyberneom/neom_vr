    sdk: flutter
  sint: ^2.0.0
  neom_core: ^2.0.0
  neom_commons: ^2.0.0
  vrlizate: ^1.13.0
  neom_vr:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

